name: Verificação do Pedido de Vendas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --check script.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('docs/pre-voo.json', 'utf8'))"
      - run: npm run build
